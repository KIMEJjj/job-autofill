# 수정 제안(Pull Request)이 오거나 main에 올라오면 자동으로 원칙 검사를 돌립니다.
# 초록색 = 원칙 위반 없음, 빨간색 = 위반 있음(합치지 않음). 자세한 판단은 MAINTAINING.md
name: 원칙 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 원칙 검사 (외부 전송·권한·암호화·제출·개인정보)
        run: python3 test/guard.py
      - name: 문법 검사 (확장 스크립트가 깨지지 않았는지)
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: 버전 맞춤 (manifest.json version = fill.js ENGINE)
        run: |
          M=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          E=$(sed -n "s/^[[:space:]]*const ENGINE = '\([^']*\)';.*/\1/p" fill.js | head -1)
          echo "manifest=$M engine=$E"; test "$M" = "$E"
