<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;font:15px -apple-system,"Apple SD Gothic Neo",sans-serif;background:#fff;color:#202124}
.bar{height:44px;background:#dee1e6;display:flex;align-items:center;padding:0 14px;gap:10px}
.url{flex:1;background:#fff;border-radius:16px;height:30px;display:flex;align-items:center;padding:0 14px;color:#3c4043}
.ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring{outline:3px solid #e8590c;outline-offset:2px}
.badge{position:absolute;width:26px;height:26px;border-radius:50%;background:#e8590c;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.menu{position:absolute;right:60px;top:80px;width:330px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:12px 0}
.menu h3{font-size:14px;margin:0 16px 8px;color:#5f6368;font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative}
.sq{width:24px;height:24px;border-radius:4px;background:#5f6368;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body style="height:300px;position:relative">
<div class="bar"><span>←</span><span>→</span><span>⟳</span><div class="url">채용 사이트 지원서 화면</div>
<div class="ico ring" style="background:#5f6368;color:#fff;font-weight:700;border-radius:6px">지<div class="badge" style="top:36px;left:2px">③</div></div>
<div class="ico ring">🧩<div class="badge" style="top:36px;left:2px">①</div></div><div class="ico">⋮</div></div>
<div class="menu"><h3>확장 프로그램</h3>
<div class="row"><div class="sq">지</div><div style="flex:1">지원서 자동입력</div><div class="ico ring">📌<div class="badge" style="right:-34px;top:2px">②</div></div></div>
<div class="row"><div class="sq" style="background:#9aa0a6">C</div><div style="flex:1;color:#5f6368">다른 확장 프로그램</div><div class="ico">📌</div></div>
</div>
</body></html>
