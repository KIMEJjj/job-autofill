<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width:280px; margin:0; padding:14px; font:13px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; color:#1d2329; }
  h1 { font-size:14px; margin:0 0 10px; }
  button { display:block; width:100%; font:inherit; padding:9px; margin-bottom:8px; border-radius:7px; border:1px solid #dde1e6; background:#fff; cursor:pointer; }
  button.primary { background:#1f5eff; color:#fff; border-color:#1f5eff; font-weight:600; }
  label { display:flex; gap:6px; align-items:center; margin:2px 0 10px; color:#444; }
  #out { background:#f6f7f9; border-radius:7px; padding:8px 10px; min-height:20px; white-space:pre-line; }
  .legend { color:#66707a; font-size:12px; margin-top:8px; }
</style>
</head>
<body style="border:1px solid #ccc">
  <h1>지원서 자동입력</h1>
  <div id="unlockBox" style="display:none">
    <button id="kcUnlock" style="display:none;background:#111418;color:#fff;border-color:#111418;font-weight:600;">🔑 Touch ID · 키체인으로 잠금 해제</button>
    <input type="password" id="pass" placeholder="잠금 암호" style="width:100%;box-sizing:border-box;font:inherit;padding:8px;margin-bottom:8px;border:1px solid #dde1e6;border-radius:7px">
  </div>
  <button class="primary" id="fill">이 페이지 채우기</button>
  <button id="agree">✔ 동의 항목 모두 체크</button>
  <label><input type="checkbox" id="overwrite"> 이미 입력된 칸도 덮어쓰기</label>
  <button id="scan">칸 목록 복사 (값 제외)</button>
  <button id="opts">내 정보 설정</button>
  <div id="out">지원서 화면을 연 상태에서 눌러 주세요.</div>
  <div class="legend">초록 테두리: 채운 칸 · 노란 테두리: 직접 확인할 빈 칸<br>제출 버튼은 누르지 않습니다.</div>
<script src="../../test/chrome-stub.js"></script><script src="../../vault.js"></script>
<script src="../../popup.js"></script>
<script>window.addEventListener("load",async()=>{ await new Promise(r=>setTimeout(r,500)); document.getElementById('unlockBox').style.display='block'; document.getElementById('out').textContent='잠금 암호를 입력하고 채우기를 눌러 주세요.'; });</script></body>
</html>
