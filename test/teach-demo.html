<!doctype html><meta charset="utf-8"><title>지원서 (시연 페이지)</title>
<!-- 칸 알려 주기·고치는 과정 시연용: '출신 국가'는 처음에 알아보지 못하는 칸 -->
<style>
  body { font: 15px -apple-system, "Apple SD Gothic Neo", sans-serif; color: #1d2329; background: #f4f6f9; margin: 0; }
  .wrap { max-width: 760px; margin: 28px auto; background: #fff; border: 1px solid #dde1e6; border-radius: 12px; padding: 22px 28px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #eef0f3; }
  .row label { width: 140px; color: #556; }
  .row input { flex: 1; padding: 7px 9px; border: 1px solid #c9d1dc; border-radius: 6px; font: inherit; }
</style>
<div class="wrap"><h1>입사지원서 (시연 페이지)</h1>
<form>
  <div class="row"><label for="a1">성명</label><input id="a1" name="userName"></div>
  <div class="row"><label for="a2">생년월일</label><input id="a2" name="birthDate"></div>
  <div class="row"><label for="a3">휴대폰</label><input id="a3" name="mobile"></div>
  <div class="row"><label for="a4">이메일</label><input id="a4" name="email"></div>
  <div class="row"><label for="a5">출신 국가</label><input id="a5" name="homeLand"></div>
  <div class="row"><label for="a6">주소</label><input id="a6" name="addr"></div>
</form></div>
