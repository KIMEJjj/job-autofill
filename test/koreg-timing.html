<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>입력·검증 시점 회귀 시험</title></head>
<body>
  <label for="applicant-name">성명</label>
  <input id="applicant-name" name="name">
  <script>
    window.ALERTS = [];
    let appState = '';
    const field = document.querySelector('#applicant-name');
    window.alert = message => ALERTS.push(message);
    field.addEventListener('input', () => {
      const valueAtInput = field.value;
      setTimeout(() => { appState = valueAtInput; }, 20);
    });
    field.addEventListener('blur', () => {
      if (appState !== field.value) alert('이름 입력 검증 시점이 빠릅니다.');
    });
  </script>
  <script src="../schema.js"></script>
  <script src="../alias.js"></script>
  <script src="../qnet.js"></script>
  <script src="../fill.js"></script>
  <script src="sample.js"></script>
</body></html>
