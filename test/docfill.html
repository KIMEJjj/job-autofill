<!doctype html><meta charset="utf-8"><title>docfill test</title>
<script src="../schema.js"></script><script src="../alias.js"></script><script src="sample.js"></script><script src="../docfill.js"></script>
<script>
// 가짜 증명사진(회색 바탕에 '사진' 글자)
(() => { const c = document.createElement('canvas'); c.width = 450; c.height = 600; const x = c.getContext('2d'); x.fillStyle = '#9aa3ad'; x.fillRect(0, 0, 450, 600); x.fillStyle = '#fff'; x.font = 'bold 90px sans-serif'; x.fillText('사진', 130, 330); window.SAMPLE.photo = c.toDataURL('image/jpeg', 0.9); })();
// 시험: 양식 파일을 가짜 프로필로 채워 base64로 돌려줌
window.runDoc = async name => {
  const buf = await (await fetch('docfill/' + name)).arrayBuffer();
  const file = new File([buf], name);
  try {
    const r = await PubDoc.fillFile(file, window.SAMPLE);
    const u8 = new Uint8Array(await r.blob.arrayBuffer()); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));
    return { name: r.name, b64: btoa(s), summary: PubDoc.summary(r.filled), unknown: r.unknown, missing: r.missing, left: r.left, preview: r.preview.length };
  } catch (e) { return { error: e.message }; }
};
</script>
