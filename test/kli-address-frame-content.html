<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>KLI 우편번호 검색 프레임</title></head>
<body>
  <section id="postcode-dialog">
    <input name="postcodify_frame" type="text" placeholder="검색 키워드">
    <button id="search" class="search_button" type="button">검색</button>
    <div id="results"></div>
    <label>기본주소 <input name="modalAddress" type="text"></label>
    <label>상세주소 <input name="modalDetail" type="text" placeholder="상세주소를 입력하세요"></label>
    <button id="save" type="button">저장</button>
    <button id="cancel" type="button">취소</button>
  </section>
  <script src="../schema.js"></script>
  <script src="../alias.js"></script>
  <script src="../qnet.js"></script>
  <script src="sample.js"></script>
  <script>
    document.getElementById('search').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'postcodify_search_result';
      const code = document.createElement('div');
      code.className = 'code5';
      code.textContent = window.SAMPLE.zip;
      const address = document.createElement('div');
      const selector = document.createElement('a');
      selector.href = '#';
      selector.className = 'selector';
      selector.textContent = window.SAMPLE.address1;
      selector.addEventListener('click', event => {
        event.preventDefault();
        document.querySelector('[name="modalAddress"]').value = window.SAMPLE.address1;
      });
      address.append(selector);
      row.append(code, address);
      document.getElementById('results').replaceChildren(row);
    });
    document.getElementById('save').addEventListener('click', () => {
      const doc = parent.document;
      let box = doc.getElementById('confirm-dialog');
      if (!box) {
        box = doc.createElement('div');
        box.id = 'confirm-dialog';
        box.innerHTML = '<p>저장하시겠습니까?</p><button id="confirm-yes" type="button">확인</button><button id="confirm-no" type="button">취소</button>';
        doc.body.append(box);
        box.querySelector('#confirm-yes').addEventListener('click', () => {
          doc.querySelector('[name="currentAddress.address"]').value = document.querySelector('[name="modalAddress"]').value;
          doc.querySelector('[name="currentAddress.detailAddress"]').value = document.querySelector('[name="modalDetail"]').value;
          box.style.display = 'none';
        });
        box.querySelector('#confirm-no').addEventListener('click', () => { box.style.display = 'none'; });
      }
      box.style.display = 'block';
    });
  </script>
  <script src="../fill.js"></script>
</body>
</html>
