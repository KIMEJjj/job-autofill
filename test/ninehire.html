<!doctype html><meta charset=utf-8><title>나인하이어형 지원서</title><body>
<!-- 나인하이어 구조 요약: 공고 제목에 '경력 모집'(구역 아님), 칸 이름은 위 div 글자, 경력 줄은 칸 안 안내글이 실제 이름 -->
<h2 class="title">[애경그룹] SAP 모듈 운영 경력 모집</h2>
<div><div>국문이름</div><div><input placeholder="내용을 입력해 주세요."></div></div>
<div><div>영문이름</div><div><input placeholder="내용을 입력해 주세요."></div></div>
<div><div>연락처</div><div><input placeholder="01012345678"></div></div>
<div><div>이메일</div><div><input placeholder="example@domain.com"></div></div>
<div><div>직전연봉(기본연봉)</div><div><input placeholder="숫자를 입력해주세요. (최대 12자리 정수)"></div></div>
<h3 class="title">경력</h3>
<div><div>고용형태</div><div><input placeholder="회사명"><input placeholder="입사일"><input placeholder="퇴사일"><input placeholder="직급/직책"><input placeholder="근무부서"><textarea placeholder="담당업무"></textarea></div></div>
<h3 class="title">어학</h3>
<div><div>언어</div><div><input placeholder="시험명"><input placeholder="주최기관"><input placeholder="점수/급"></div></div>
<script src="../schema.js"></script><script src="../alias.js"></script><script src="../qnet.js"></script><script src="../fill.js"></script><script src="sample.js"></script>
</body>
