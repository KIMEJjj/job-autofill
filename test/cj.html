<!doctype html><meta charset=utf-8><title>CJ 회원가입형</title><body>
<!-- recruit.cj.net 회원가입 칸 구조 (칸 목록 복사 기준) -->
<div><p>이름 <span>필수</span></p>
 <label for="ln" class="blind">한글 성</label><input type="text" id="ln" name="last_name" placeholder="성">
 <label for="fn" class="blind">한글 이름</label><input type="text" id="fn" name="first_name" placeholder="이름"></div>
<div><p>영문 <span>필수</span></p>
 <label for="eln">영문 성</label><input type="text" id="eln" name="zz_eng_last_name" placeholder="영문 성">
 <label for="efn">영문 이름</label><input type="text" id="efn" name="zz_eng_first_name" placeholder="영문 이름"></div>
<div><p>성별 <span>*</span></p>
 <input type="radio" name="sex" id="sexM" value="M" style="position:absolute;opacity:0;width:1px;height:1px"><label for="sexM"><span class="ico"></span>남</label>
 <input type="radio" name="sex" id="sexF" value="F" style="position:absolute;opacity:0;width:1px;height:1px"><label for="sexF"><span class="ico"></span>여</label></div>
<script>
// 꾸민 라디오: 이름표를 눌렀을 때만 화면 표시(.on) 바뀜, input.click()으로는 안 바뀜
document.querySelectorAll('label[for^=sex]').forEach(l=>l.addEventListener('mousedown',()=>{document.querySelectorAll('label[for^=sex]').forEach(x=>x.classList.remove('on')); l.classList.add('on');}));
</script>
<div><p>생년월일 <span>필수</span></p><input type="text" name="birthdate"></div>
<div><p>이메일주소 <span>필수</span></p>
 <label for="eid">이메일 아이디</label><input type="text" id="eid" name="email_id" placeholder="메일 ID"> @
 <label for="edm">이메일 도메인</label><input type="text" id="edm" name="email_domain">
 <label for="dl">이메일 도메인 선택</label><select id="dl" name="domainList"><option value="">직접입력</option><option>naver.com</option><option>gmail.com</option></select>
 <label for="au">인증번호</label><input type="text" id="au" name="authNumEmail" placeholder="인증번호 5자리"></div>
<div><p>휴대전화번호 <span>필수</span></p>
 <input type="text" name="zz_cell_phone_kor1" title="국내 휴대폰번호 첫번째 자리"><input type="text" name="zz_cell_phone_kor2" title="국내 휴대폰번호 가운데 자리"><input type="text" name="zz_cell_phone_kor3" title="국내 휴대폰번호 마지막 자리"></div>
<div><p>병역사항 (필수항목)</p>
 <input type="radio" name="zz_army_r050" id="a1" value="1"><label for="a1">필</label><input type="radio" name="zz_army_r050" id="a2" value="2"><label for="a2">미필</label><input type="radio" name="zz_army_r050" id="a3" value="3"><label for="a3">면제</label><input type="radio" name="zz_army_r050" id="a4" value="4"><label for="a4">면제(여성)</label><input type="radio" name="zz_army_r050" id="a5" value="5"><label for="a5">면제(외국국적)</label><input type="radio" name="zz_army_r050" id="a6" value="6"><label for="a6">전역 예정</label>
 <label for="r060">군별</label><select name="zz_army_r060" id="r060"><option value="">군별 선택</option><option>육군</option><option>해군</option></select>
 <label for="r070">최종계급</label><select name="zz_army_r070" id="r070"><option value="">최종계급 선택</option><option>상병</option><option>병장</option></select>
 <p>복무기간 <span>필수</span></p><input type="text" name="zz_army_str_dt" title="입대일자 YYYY.MM.DD" placeholder="입대일자 YYYY.MM.DD"> ~ <input type="text" name="zz_army_end_dt" title="전역일자 YYYY.MM.DD" placeholder="전역일자 YYYY.MM.DD"></div>
<div><h3>학력사항</h3><p>학교명 <span>필수</span></p><input type="text" name="zz_school_nm" placeholder="대학교">
 <p>전공 <span>필수</span></p><input type="text" name="mm_major_nm" placeholder="전공">
 <p>학점</p><input type="text" name="zz_sch_point" placeholder="평점"><select name="zz_credit" title="학점 만점 선택"><option value="">선택</option><option>4.5</option><option>4.3</option></select>
 <p>재학기간 <span>필수</span></p><input type="text" name="zz_str_yymm" placeholder="입학 YYYY.MM"> ~ <input type="text" name="zz_end_yymm" placeholder="졸업 YYYY.MM"></div>
<div><h3>경력사항</h3><p>근무처(회사명)</p><input type="text" name="zz_company_nm" placeholder="근무처"><p>직급</p><input type="text" name="zz_position" placeholder="직급 입력">
 <p>기간 <span>필수</span></p><input type="text" name="career_zz_str_yymm" placeholder="입사 YYYY.MM"> ~ <input type="text" name="career_zz_end_yymm" placeholder="퇴사 YYYY.MM"></div>
<div><h3>자격증</h3><p>자격증 주관처 <span>필수</span></p><input type="text" name="zz_inst_nm" placeholder="주관처 입력"><p>응시일자 <span>필수</span></p><input type="text" name="certificate_zz_acqu_dt" placeholder="YYYY.MM.DD"></div>
<script src="../schema.js"></script><script src="../alias.js"></script><script src="../qnet.js"></script><script src="../fill.js"></script><script src="sample.js"></script>
</body>
