<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>recruiter 형식</title></head><body>
<section class="writeResume">
<div class="row"><div class="span per20"><label for="name">성명</label></div><div class="span per40"><input type="text" id="name" name="name"></div></div>
<div class="row"><div class="span per20"><label for="mobile1">휴대전화</label></div>
<div class="span per10 mobile"><input type="text" id="mobile1" name="mobile1" maxlength="3" aria-label="휴대전화 첫번째 자리"></div>
<div class="span per10 mobile"><input type="text" id="mobile2" name="mobile2" maxlength="4" aria-label="휴대전화 두번째 자리"></div>
<div class="span per10 mobile"><input type="text" id="mobile3" name="mobile3" maxlength="4" aria-label="휴대전화 세번째 자리"></div></div>
<div class="row"><div class="span per20"><label for="email">이메일</label></div>
<div class="span per60"><input type="email" id="email" name="email" placeholder="이메일을 입력해주세요."></div>
<div class="span per60"><input type="email" id="emailConfirm" name="emailConfirm" placeholder="이메일 확인을 위해 다시 한번 입력해주세요."></div></div>
<div class="row"><div class="span per20"><label for="password">비밀번호</label></div><div class="span per60"><input type="password" id="password" name="password"></div></div>
</section>
<script src="../schema.js"></script><script src="../alias.js"></script><script src="../qnet.js"></script><script src="../fill.js"></script><script src="sample.js"></script></body></html>
