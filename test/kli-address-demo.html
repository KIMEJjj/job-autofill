<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주소 입력 시연 (가짜 정보)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f5f7; color: #222831; font: 15px/1.6 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .page { max-width: 960px; margin: 0 auto; padding: 46px 30px 80px; }
  .page h1 { font-size: 27px; margin: 0 0 8px; letter-spacing: -.4px; }
  .crumb { color: #8a929b; font-size: 13px; margin-bottom: 28px; }
  .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 14px; padding: 26px 30px 30px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .card p.hint { margin: 0 0 16px; color: #8a929b; font-size: 13px; }
  .field { display: grid; grid-template-columns: 108px 1fr; gap: 18px; align-items: center; padding: 14px 0; border-top: 1px solid #f1f3f5; }
  .field.first { border-top: 0; }
  .field > label { color: #4b5563; font-size: 14px; font-weight: 600; }
  input[type=text] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #cfd5dc; border-radius: 7px; font-size: 15px; color: #222831; background: #fff; transition: border-color .15s, box-shadow .15s; }
  input[type=text]:focus { outline: none; border-color: #1f4e9c; box-shadow: 0 0 0 3px rgba(31,78,156,.12); }
  input[readonly] { background: #f7f8fa; }
  .addr-line { display: flex; gap: 10px; }
  .tab { flex: 0 0 auto; width: 108px; height: 46px; border: 0; border-radius: 7px; background: #1f4e9c; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .12s, background .12s; }
  .tab:active { transform: scale(.97); }
  .tab.clicked { background: #173b75; }
  .modal { position: fixed; inset: 0; background: rgba(17,20,24,.45); display: flex; align-items: flex-start; justify-content: center; padding: 42px 20px; z-index: 10; }
  .modal[hidden] { display: none; }
  .sheet { width: 700px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 26px 70px rgba(0,0,0,.35); overflow: hidden; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet > header { padding: 20px 24px 16px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #eef0f3; }
  .searchbar { display: flex; gap: 0; padding: 20px 24px 16px; }
  .searchbar input { height: 48px; border-radius: 7px 0 0 7px; border-right: 0; }
  .searchbar button { flex: 0 0 auto; width: 96px; height: 48px; border: 0; border-radius: 0 7px 7px 0; background: #2b3f6b; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .results { padding: 0 24px; min-height: 178px; }
  .results .empty { color: #9aa1a9; font-size: 14px; padding: 26px 2px; text-align: center; }
  .postcodify_search_result { border: 1px solid #e4e7eb; border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: baseline; animation: pop .16s ease-out; }
  .postcodify_search_result .code5 { flex: 0 0 auto; color: #1f4e9c; font-weight: 700; font-size: 14px; }
  .postcodify_search_result a.selector { color: #222831; text-decoration: none; font-size: 15px; }
  .postcodify_search_result a.selector:hover { text-decoration: underline; }
  .picked { padding: 6px 24px 6px; border-top: 1px solid #f1f3f5; }
  .picked .field { grid-template-columns: 84px 1fr; padding: 10px 0; border-top: 0; }
  .sheet > footer { display: flex; gap: 10px; justify-content: center; padding: 16px 24px 22px; }
  .sheet > footer button { min-width: 132px; height: 48px; border-radius: 7px; border: 1px solid #cfd5dc; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .sheet > footer button.primary { background: #1f4e9c; border-color: #1f4e9c; color: #fff; }
  .confirm { width: 460px; max-width: 100%; margin-top: 120px; background: #fff; border-radius: 12px; box-shadow: 0 26px 70px rgba(0,0,0,.35); padding: 30px 28px 24px; animation: pop .18s ease-out; }
  .confirm p { margin: 0 0 24px; font-size: 17px; font-weight: 600; }
  .confirm .btns { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm button { min-width: 96px; height: 42px; border-radius: 6px; border: 1px solid #cfd5dc; background: #fff; font-size: 15px; cursor: pointer; }
  .confirm button.primary { background: #1f4e9c; border-color: #1f4e9c; color: #fff; }
  .done { margin-top: 18px; color: #1a7f4b; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s; }
  .done.show { opacity: 1; }
</style>
</head>
<body>
  <div class="page">
    <h1>입사지원서</h1>
    <div class="crumb">한국노동연구원 · 신입 채용</div>
    <section class="card">
      <h2>주소</h2>
      <p class="hint">우편번호 탭을 열면 주소를 검색할 수 있습니다.</p>
      <div class="field first">
        <label>기본주소</label>
        <div class="addr-line">
          <input name="currentAddress.address" type="text" placeholder="주소를 입력하세요">
          <button id="postcode-tab" class="tab" type="button">우편번호</button>
        </div>
      </div>
      <div class="field">
        <label>상세주소</label>
        <input name="currentAddress.detailAddress" type="text" placeholder="상세주소를 입력하세요">
      </div>
      <p class="done" id="done">주소가 입력되었습니다.</p>
    </section>
  </div>

  <div class="modal" id="postcode-modal" hidden>
    <div class="sheet">
      <header>우편번호 찾기</header>
      <div class="searchbar">
        <input name="postcodify_demo" type="text" placeholder="예 : 반포대교로 201, 국립중앙도서관, 삼성동 25">
        <button id="search" class="search_button" type="button">검색</button>
      </div>
      <div class="results" id="results"><div class="empty">도로명, 지번, 건물명으로 검색해 주세요.</div></div>
      <div class="picked">
        <div class="field"><label>기본주소</label><input name="modalAddress" class="postcodify_address" type="text" readonly></div>
        <div class="field"><label>상세주소</label><input name="modalDetail" class="postcodify_details" type="text" placeholder="상세주소를 입력하세요"></div>
      </div>
      <footer>
        <button id="save" class="primary" type="button">저장</button>
        <button id="cancel" type="button">취소</button>
      </footer>
    </div>
  </div>

  <div class="modal" id="confirm-modal" hidden>
    <div class="confirm">
      <p>저장하시겠습니까?</p>
      <div class="btns">
        <button id="confirm-yes" class="primary" type="button">확인</button>
        <button id="confirm-no" type="button">취소</button>
      </div>
    </div>
  </div>

  <script>
    const S = () => window.SAMPLE;
    const tab = document.getElementById('postcode-tab');
    const modal = document.getElementById('postcode-modal');
    const confirmModal = document.getElementById('confirm-modal');
    const results = document.getElementById('results');
    const modalAddress = document.querySelector('[name="modalAddress"]');
    const modalDetail = document.querySelector('[name="modalDetail"]');
    const formAddress = document.querySelector('[name="currentAddress.address"]');
    const formDetail = document.querySelector('[name="currentAddress.detailAddress"]');

    tab.addEventListener('click', () => {
      tab.classList.add('clicked');
      setTimeout(() => {
        modal.hidden = false;
        document.querySelector('[name="postcodify_demo"]').focus();
      }, 260);
    });

    document.getElementById('search').addEventListener('click', () => {
      results.innerHTML = '<div class="empty">검색 중…</div>';
      setTimeout(() => {
        const row = document.createElement('div');
        row.className = 'postcodify_search_result';
        const code = document.createElement('div');
        code.className = 'code5';
        code.textContent = S().zip;
        const address = document.createElement('div');
        const selector = document.createElement('a');
        selector.href = '#';
        selector.className = 'selector';
        selector.textContent = S().address1;
        selector.addEventListener('click', event => {
          event.preventDefault();
          row.style.borderColor = '#1f4e9c';
          row.style.background = '#f5f8ff';
          setTimeout(() => { modalAddress.value = S().address1; }, 700);
        });
        address.append(selector);
        row.append(code, address);
        results.replaceChildren(row);
      }, 1200);
    });

    document.getElementById('save').addEventListener('click', () => {
      setTimeout(() => { confirmModal.hidden = false; }, 700);
    });

    document.getElementById('cancel').addEventListener('click', () => { modal.hidden = true; });

    document.getElementById('confirm-yes').addEventListener('click', () => {
      formAddress.value = modalAddress.value;
      formDetail.value = modalDetail.value;
      formAddress.dispatchEvent(new Event('input', { bubbles: true }));
      formDetail.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(() => {
        confirmModal.hidden = true;
        modal.hidden = true;
        document.getElementById('done').classList.add('show');
      }, 600);
    });

    document.getElementById('confirm-no').addEventListener('click', () => { confirmModal.hidden = true; });
  </script>
</body>
</html>
